[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hunt-telegram-collector"
version = "0.1.0"
description = "Local-first, read-only Telegram vacancy collector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Telethon==1.45.0", "PyYAML==6.0.3", "python-dotenv==1.2.1"]

[project.optional-dependencies]
sheets = ["google-auth==2.43.0", "requests==2.32.5"]
dev = ["pytest==9.0.2", "ruff==0.14.6"]

[project.scripts]
hunt = "hunt_telegram_collector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
